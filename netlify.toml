# Silvano consult landing pages. Static HTML, no build step.
[build]
  publish = "."

# The root sends visitors to the main site; ads point at /wedding/ and /business/.
[[redirects]]
  from = "/"
  to = "https://wearsilvano.com"
  status = 302

# CSS and JS: always revalidate, so a change shows up on the next visit
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Images, films and fonts: cache for a week
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
